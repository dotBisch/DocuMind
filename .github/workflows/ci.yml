name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: pytest

  # Retrieval-accuracy regression gate (eval/run_eval.py, no LLM judge in
  # CI — objective and cheap). Skips with a notice until the repo has
  # SUPABASE_URL / SUPABASE_KEY / GEMINI_API_KEY secrets and an
  # EVAL_SESSION_ID variable (from a local `python -m eval.run_eval --ingest`).
  eval:
    runs-on: ubuntu-latest
    needs: test
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EVAL_SESSION_ID: ${{ vars.EVAL_SESSION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check eval credentials
        id: creds
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ] && [ -n "$GEMINI_API_KEY" ] && [ -n "$EVAL_SESSION_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::eval skipped — secrets/EVAL_SESSION_ID not configured"
          fi
      - if: steps.creds.outputs.ok == 'true'
        run: pip install -r requirements.txt
      - if: steps.creds.outputs.ok == 'true'
        run: python -m eval.run_eval
